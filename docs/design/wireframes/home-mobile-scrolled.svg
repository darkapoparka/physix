<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc"><title id="title">PhysiX — lower homepage viewport</title><desc id="desc">PhysiX implementation wireframe. Synthetic content and labelled asset placeholders, not a screenshot of a working application. Typography and content continue naturally on scroll.</desc><rect width="390" height="844" fill="#F7FBFA"/><g font-family="Arial, sans-serif"><text x="20" y="37" font-size="24" font-weight="700" fill="#13252E">PhysiX</text><path d="M342 22h24 M342 30h24 M342 38h24" fill="none" stroke="#13252E" stroke-width="2" stroke-linecap="round"/><text x="20" y="61" font-size="10" font-weight="600" fill="#4D626B">WIREFRAME · SYNTHETIC PREVIEW</text><text x="20" y="99" font-size="23" font-weight="700" fill="#13252E">Your care, with Charlie</text><rect x="20" y="119" width="350" height="206" rx="20" fill="#FFFFFF"/><rect x="36" y="135" width="90" height="95" rx="18" fill="#EDF6F3"/><circle cx="98.1" cy="173.0" r="21.599999999999998" fill="#CDEAE2"/><text x="48" y="212" font-size="12" font-weight="500" fill="#4D626B">Portrait</text><text x="144" y="160" font-size="21" font-weight="700" fill="#13252E">Hi, I’m Charlie</text><text x="144" y="188" font-size="14" font-weight="400" fill="#4D626B">Read about my approach</text><text x="144" y="211" font-size="14" font-weight="400" fill="#4D626B">and experience.</text><rect x="36" y="249" width="155" height="30" rx="14" fill="#EDF6F3"/><text x="48" y="269" font-size="12" font-weight="500" fill="#4D626B">Verified credential</text><text x="36" y="303" font-size="15" font-weight="600" fill="#11695C">View Charlie’s profile  →</text><rect x="20" y="347" width="350" height="98" rx="20" fill="#EDF6F3"/><text x="36" y="378" font-size="20" font-weight="700" fill="#13252E">Real patient feedback</text><text x="36" y="405" font-size="14" font-weight="400" fill="#4D626B">Only show approved, genuine reviews.</text><text x="36" y="426" font-size="13" font-weight="400" fill="#4D626B">Hide this section until available.</text><text x="20" y="489" font-size="23" font-weight="700" fill="#13252E">Visit PhysiX</text><rect x="20" y="507" width="350" height="101" rx="20" fill="#FFFFFF"/><text x="36" y="537" font-size="17" font-weight="600" fill="#13252E">Clinic details to be confirmed</text><text x="36" y="562" font-size="13" font-weight="400" fill="#4D626B">Address · hours · accessible directions</text><text x="36" y="586" font-size="14" font-weight="600" fill="#11695C">Contact and directions  →</text><rect x="20" y="630" width="350" height="111" rx="20" fill="#EDF6F3"/><text x="36" y="659" font-size="21" font-weight="700" fill="#13252E">Continue at home</text><text x="36" y="684" font-size="14" font-weight="400" fill="#4D626B">Guided programmes — R2 preview</text><text x="36" y="713" font-size="13" font-weight="400" fill="#4D626B">Only promote when content is ready.</text><rect x="12" y="766" width="366" height="66" rx="25" fill="#FFFFFF" stroke="#DCE8E4"/><rect x="25" y="773" width="78" height="51" rx="17" fill="#EDF6F3"/><path d="M52 795v-9l9-7 9 7v9h-6v-7h-6v7z" fill="none" stroke="#11695C" stroke-width="1.8" stroke-linejoin="round"/><text x="42" y="815" font-size="12" font-weight="600" fill="#11695C">Home</text><path d="M141 781h18v15h-18z M141 786h18 M145 778v7 M155 778v7" fill="none" stroke="#4D626B" stroke-width="1.8" stroke-linejoin="round"/><text x="131" y="815" font-size="12" font-weight="400" fill="#4D626B">Book</text><path d="M228 783h15v12h-15z M243 786l7-4v14l-7-4" fill="none" stroke="#4D626B" stroke-width="1.8" stroke-linejoin="round"/><text x="220" y="815" font-size="12" font-weight="400" fill="#4D626B">Online</text><path d="M320 797c0-11 17-11 17 0 M324 782a4 4 0 1 0 8 0a4 4 0 1 0-8 0" fill="none" stroke="#4D626B" stroke-width="1.8" stroke-linejoin="round"/><text x="304" y="815" font-size="12" font-weight="400" fill="#4D626B">Account</text></g></svg>