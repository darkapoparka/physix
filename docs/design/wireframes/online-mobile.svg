<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc"><title id="title">PhysiX — human online consultation</title><desc id="desc">PhysiX implementation wireframe. Synthetic content and labelled asset placeholders, not a screenshot of a working application. Typography and content continue naturally on scroll.</desc><rect width="390" height="844" fill="#F7FBFA"/><g font-family="Arial, sans-serif"><text x="20" y="37" font-size="24" font-weight="700" fill="#13252E">‹  Online</text><path d="M342 22h24 M342 30h24 M342 38h24" fill="none" stroke="#13252E" stroke-width="2" stroke-linecap="round"/><text x="20" y="61" font-size="10" font-weight="600" fill="#4D626B">WIREFRAME · SYNTHETIC PREVIEW</text><text x="20" y="111" font-size="30" font-weight="700" fill="#13252E">Expert guidance,</text><text x="20" y="149" font-size="30" font-weight="700" fill="#13252E">wherever you are.</text><text x="20" y="181" font-size="14" font-weight="400" fill="#4D626B">A remote appointment with a real clinician.</text><rect x="20" y="208" width="350" height="154" rx="18" fill="#EDF6F3"/><circle cx="261.5" cy="269.6" r="36.96" fill="#CDEAE2"/><text x="32" y="344" font-size="12" font-weight="500" fill="#4D626B">Approved Charlie / video consultation photograph</text><text x="20" y="406" font-size="23" font-weight="700" fill="#13252E">How it works</text><circle cx="38" cy="449" r="18" fill="#CDEAE2"/><text x="34" y="454" font-size="14" font-weight="700" fill="#11695C">1</text><text x="69" y="445" font-size="17" font-weight="600" fill="#13252E">Choose a time</text><text x="69" y="469" font-size="12" font-weight="400" fill="#4D626B">Select an available online appointment.</text><circle cx="38" cy="533" r="18" fill="#CDEAE2"/><text x="34" y="538" font-size="14" font-weight="700" fill="#11695C">2</text><text x="69" y="529" font-size="17" font-weight="600" fill="#13252E">Meet your physiotherapist</text><text x="69" y="553" font-size="12" font-weight="400" fill="#4D626B">Join using your private appointment link.</text><circle cx="38" cy="617" r="18" fill="#CDEAE2"/><text x="34" y="622" font-size="14" font-weight="700" fill="#11695C">3</text><text x="69" y="613" font-size="17" font-weight="600" fill="#13252E">Agree the next step</text><text x="69" y="637" font-size="12" font-weight="400" fill="#4D626B">The clinician may recommend in-person care.</text><text x="20" y="693" font-size="12" font-weight="400" fill="#4D626B">Offer only when the clinic is ready to deliver.</text><rect x="20" y="708" width="350" height="50" rx="15" fill="#11695C"/><text x="36" y="739" font-size="16" font-weight="600" fill="#FFFFFF">View online appointment times  →</text><rect x="12" y="766" width="366" height="66" rx="25" fill="#FFFFFF" stroke="#DCE8E4"/><path d="M52 795v-9l9-7 9 7v9h-6v-7h-6v7z" fill="none" stroke="#4D626B" stroke-width="1.8" stroke-linejoin="round"/><text x="42" y="815" font-size="12" font-weight="400" fill="#4D626B">Home</text><path d="M141 781h18v15h-18z M141 786h18 M145 778v7 M155 778v7" fill="none" stroke="#4D626B" stroke-width="1.8" stroke-linejoin="round"/><text x="131" y="815" font-size="12" font-weight="400" fill="#4D626B">Book</text><rect x="203" y="773" width="78" height="51" rx="17" fill="#EDF6F3"/><path d="M228 783h15v12h-15z M243 786l7-4v14l-7-4" fill="none" stroke="#11695C" stroke-width="1.8" stroke-linejoin="round"/><text x="220" y="815" font-size="12" font-weight="600" fill="#11695C">Online</text><path d="M320 797c0-11 17-11 17 0 M324 782a4 4 0 1 0 8 0a4 4 0 1 0-8 0" fill="none" stroke="#4D626B" stroke-width="1.8" stroke-linejoin="round"/><text x="304" y="815" font-size="12" font-weight="400" fill="#4D626B">Account</text></g></svg>