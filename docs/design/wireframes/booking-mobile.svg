<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc"><title id="title">PhysiX — focused booking flow</title><desc id="desc">PhysiX implementation wireframe. Synthetic content and labelled asset placeholders, not a screenshot of a working application. Typography and content continue naturally on scroll.</desc><rect width="390" height="844" fill="#F7FBFA"/><g font-family="Arial, sans-serif"><text x="20" y="37" font-size="24" font-weight="700" fill="#13252E">‹  Book a visit</text><path d="M342 22h24 M342 30h24 M342 38h24" fill="none" stroke="#13252E" stroke-width="2" stroke-linecap="round"/><text x="20" y="61" font-size="10" font-weight="600" fill="#4D626B">WIREFRAME · SYNTHETIC PREVIEW</text><text x="20" y="101" font-size="29" font-weight="700" fill="#13252E">Choose your time</text><text x="20" y="131" font-size="14" font-weight="600" fill="#11695C">Time  →  Details  →  Review</text><rect x="20" y="154" width="350" height="114" rx="20" fill="#FFFFFF" stroke="#DCE8E4"/><text x="36" y="185" font-size="21" font-weight="700" fill="#13252E">First appointment</text><text x="36" y="211" font-size="15" font-weight="400" fill="#4D626B">With Charlie · In clinic</text><text x="36" y="242" font-size="13" font-weight="400" fill="#4D626B">Duration and fee from approved offering</text><text x="20" y="310" font-size="21" font-weight="700" fill="#13252E">September 2026</text><text x="285" y="310" font-size="24" font-weight="500" fill="#11695C">‹       ›</text><rect x="20" y="330" width="62" height="74" rx="15" fill="#FFFFFF" stroke="#DCE8E4"/><text x="34" y="355" font-size="12" font-weight="500" fill="#4D626B">Mon</text><text x="41" y="387" font-size="22" font-weight="600" fill="#13252E">14</text><rect x="92" y="330" width="62" height="74" rx="15" fill="#FFFFFF" stroke="#DCE8E4"/><text x="106" y="355" font-size="12" font-weight="500" fill="#4D626B">Tue</text><text x="113" y="387" font-size="22" font-weight="600"