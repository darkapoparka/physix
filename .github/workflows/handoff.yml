name: Handoff integrity

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  handoff:
    name: Docs, tooling and pinned source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out PhysiX and the pinned reference source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Test preparation helpers
        run: node --test tests/tooling/handoff.test.mjs
      - name: Verify current documents and source boundaries
        run: node scripts/check-handoff.mjs
      - name: Verify exact initialized Gymaf source
        run: node scripts/verify-upstream.mjs --require-checkout
      # This job installs no app dependencies and executes no vendor code.
      # Application, database and browser gates are added during local implementation.
